<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg_space" cx="50%" cy="45%" r="52%">
      <stop offset="0%" stop-color="#08142c" />
      <stop offset="40%" stop-color="#030713" />
      <stop offset="80%" stop-color="#010207" />
      <stop offset="100%" stop-color="#000103" />
    </radialGradient>
    
    <radialGradient id="core_aura" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.75" />
      <stop offset="25%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#1e3a8a" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="hand_aura" cx="50%" cy="66%" r="28%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="jacket_grad" x1="256" y1="270" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="20%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#070d1a" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <linearGradient id="hair_main" x1="256" y1="30" x2="256" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="75%" stop-color="#e0f2fe" />
      <stop offset="90%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="blindfold_grad" x1="210" y1="190" x2="302" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="45%" stop-color="#1e293b" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="skin_grad" x1="256" y1="210" x2="256" y2="285" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <filter id="glow_cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1:1 Canvas Background -->
  <rect width="512" height="512" fill="url(#bg_space)" />

  <!-- Dense Surging Radial Aura -->
  <circle cx="256" cy="230" r="220" fill="url(#core_aura)" />
  <circle cx="256" cy="350" r="160" fill="url(#hand_aura)" />

  <!-- High-Energy Lightning Bolts in Background -->
  <path d="M110,180 L145,230 L130,260 L180,310" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M402,180 L367,230 L382,260 L332,310" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M80,320 L130,350 L110,390 L160,440" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M432,320 L382,350 L402,390 L352,440" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M190,90 L210,140 L195,160 L230,190" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M322,90 L302,140 L317,160 L282,190" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- High-Collar Sorcerer Outfit Body -->
  <path d="M100,512 L140,360 L200,320 L256,345 L312,320 L372,360 L412,512 Z" fill="url(#jacket_grad)" />
  
  <!-- High Stiff Collar Structure -->
  <path d="M165,335 C165,280 195,250 215,240 L256,268 L297,240 C317,250 347,280 347,335 L315,360 L256,345 L197,360 Z" fill="#080f1e" stroke="#1e3a8a" stroke-width="2.5" />

  <!-- Face & Chin Structure -->
  <path d="M220,215 C220,250 236,275 256,288 C276,275 292,250 292,215 Z" fill="url(#skin_grad)" />
  
  <!-- Smirk Mouth Line -->
  <path d="M246,263 Q256,267 268,260" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M256,265 Q260,266 264,264" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Blindfold Band -->
  <path d="M205,192 C215,182 297,182 307,192 L302,225 C295,233 217,233 210,225 Z" fill="url(#blindfold_grad)" />
  <path d="M206,208 C230,213 282,213 306,208" stroke="#334155" stroke-width="1.2" fill="none" />

  <!-- Glowing Blue Eyes Peeking / Eye Reflection Edges -->
  <path d="M224,218 Q238,220 242,216" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow_cyan)" />
  <path d="M270,216 Q274,220 288,218" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow_cyan)" />
  <circle cx="234" cy="217" r="2.5" fill="#ffffff" />
  <circle cx="278" cy="217" r="2.5" fill="#ffffff" />

  <!-- Iconic Spiky Luminous White Hair -->
  <path d="M176,192 C158,162 150,118 184,98 C194,118 202,112 212,80 C222,108 236,98 256,60 C276,98 290,108 300,80 C310,112 318,118 328,98 C362,118 354,162 336,192 C322,162 308,165 304,172 C290,154 272,154 256,162 C240,154 222,154 208,172 C204,165 190,162 176,192 Z" fill="url(#hair_main)" />

  <!-- Hair Highlights & Detailed Sharp Tuft Strands -->
  <path d="M218,150 L230,190 L242,160 L256,194 L270,160 L282,190 L294,150" fill="#ffffff" />
  <path d="M188,115 L200,155 L212,130 L224,165 L240,120 L256,170 L272,120 L288,165 L300,130 L312,155 L324,115" fill="#f0f9ff" />

  <!-- Raised Mudra Domain Sign (Two Fingers Cross Gesture in Foreground) -->
  <path d="M242,258 L250,225 L259,225 L266,258 L272,315 L236,315 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <path d="M246,227 L253,190 L259,190 L257,227 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <path d="M256,227 L263,184 L269,184 L265,227 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />

  <!-- Hand Palm & Lower Arm Structure -->
  <path d="M226,295 C226,275 246,275 246,295 L246,365 L218,365 Z" fill="#f1f5f9" />
  <path d="M266,295 C266,275 286,275 286,295 L286,365 L258,365 Z" fill="#f1f5f9" />
  <path d="M215,360 L297,360 L305,440 L207,440 Z" fill="#e2e8f0" />
  <path d="M205,420 L307,420 L320,512 L192,512 Z" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />

  <!-- Floating Energy Spark Embers Around Character -->
  <circle cx="120" cy="140" r="3.5" fill="#67e8f9" filter="url(#glow_cyan)" />
  <circle cx="392" cy="140" r="3.5" fill="#67e8f9" filter="url(#glow_cyan)" />
  <circle cx="95" cy="270" r="4" fill="#38bdf8" filter="url(#glow_cyan)" />
  <circle cx="417" cy="270" r="4" fill="#38bdf8" filter="url(#glow_cyan)" />
  <circle cx="140" cy="410" r="3" fill="#00f0ff" filter="url(#glow_cyan)" />
  <circle cx="372" cy="410" r="3" fill="#00f0ff" filter="url(#glow_cyan)" />

  <!-- High-Tech Electric Blue Outer Glow Ring (Centered for Circle Mask) -->
  <circle cx="256" cy="256" r="250" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.75" fill="none" />
  <circle cx="256" cy="256" r="246" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" fill="none" />
</svg>